<!doctype html>
<html lang="en" data-cwsp-surface="vds-main">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>CWSP-shell</title>
    <link rel="icon" type="image/svg+xml" href="./pwa/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./pwa/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa/icons/icon.png" />
    <link rel="shortcut icon" href="./pwa/icons/favicon.ico" />
    <!-- WHY: iOS home-screen icon (does not use manifest icons). -->
    <link rel="apple-touch-icon" href="./pwa/icons/apple-touch-icon.png" />
    <!-- WHY: relative so u2re.space root SPA resolves under Vite base "./". -->
    <link rel="manifest" href="./pwa/manifest.json" />
    <!-- WHY: warm surface for WCO; #007acc painted a blue control strip over light titlebars. -->
    <meta name="theme-color" content="#cbb8a4" data-theme-color />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="CWSP-shell — U2RE environment workspace" />
    <script>
        // WHY: stale unhashed com/app.js binds `__vitePreload` to the wrong export.
        (function () {
            var KEY = "cw-shell-preload-bust";
            function stale(msg) {
                return /does not provide an export named|export named ['"]|__vitePreload|catch is not a function|Calling `require` for|Failed to fetch dynamically imported module|error loading dynamically imported module/i.test(String(msg || ""));
            }
            function missingEntry(src) {
                return /\/assets\/index-[A-Za-z0-9_-]+\.(m?js|css)(?:$|\?)/i.test(String(src || ""));
            }
            function bust() {
                if (sessionStorage.getItem(KEY)) return;
                sessionStorage.setItem(KEY, "1");
                var done = function () { location.reload(); };
                var sw = navigator.serviceWorker;
                var unreg = sw && sw.getRegistrations
                    ? sw.getRegistrations().then(function (regs) {
                        return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    })
                    : Promise.resolve();
                var clear = self.caches
                    ? caches.keys().then(function (keys) {
                        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    })
                    : Promise.resolve();
                Promise.all([unreg, clear]).then(done).catch(done);
            }
            addEventListener("error", function (e) {
                if (stale(e && e.message)) bust();
                var t = e && e.target;
                if (t && missingEntry(t.src || t.href)) bust();
            }, true);
            addEventListener("unhandledrejection", function (e) {
                var r = e && e.reason;
                if (stale(r && r.message ? r.message : r)) bust();
            });
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; inline-size: 100%; block-size: 100%; overflow: hidden; background-color: #121418; }
        #app {
            display: grid; place-items: center; inline-size: 100%; block-size: 100%;
            min-block-size: 100dvb; background-color: transparent;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        /* WHY: a custom photo must paint before the bundled file. IDB bytes are also
         * stored in Cache `cwsp-user-wallpaper` and served by InstallEvent.addRoutes
         * at `/assets/user-wallpaper` before the service worker starts. */
        (function () {
            var STOCK = "/assets/wallpaper.jpg";
            var USER = "/assets/user-wallpaper";
            var pointer = "";
            try { pointer = String(localStorage.getItem("rs-wallpaper-image") || "").trim(); } catch (e) {}
            var custom = pointer && pointer !== STOCK && pointer.indexOf("blob:") !== 0;
            function paint(url) {
                document.documentElement.style.backgroundColor = "#121418";
                document.documentElement.style.backgroundImage = "url('" + url + "')";
                document.documentElement.style.backgroundPosition = "center";
                document.documentElement.style.backgroundSize = "cover";
                document.documentElement.style.backgroundRepeat = "no-repeat";
            }
            function preload(url) {
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "image";
                link.href = url;
                try { link.fetchPriority = "high"; } catch (e) {}
                document.head.appendChild(link);
            }
            if (!custom) {
                preload(STOCK);
                paint(STOCK);
                return;
            }
            if (pointer.indexOf("idb:") === 0) {
                preload(USER);
                paint(USER);
                try {
                    var open = indexedDB.open("cwsp-wallpaper-v1", 1);
                    open.onsuccess = function () {
                        var db = open.result;
                        if (!db.objectStoreNames.contains("blobs")) return;
                        var get = db.transaction("blobs", "readonly").objectStore("blobs").get("current");
                        get.onsuccess = function () {
                            var blob = get.result;
                            if (!(blob instanceof Blob) || !blob.size) return;
                            paint(URL.createObjectURL(blob));
                        };
                    };
                } catch (e) {}
                return;
            }
            if (pointer.indexOf("data:image/") === 0 || pointer.charAt(0) === "/" || pointer.indexOf("http") === 0) {
                preload(pointer);
                paint(pointer);
                return;
            }
            preload(STOCK);
            paint(STOCK);
        })();
    </script>
    <script>
        // WHY: /markdown is a host alias for viewer; stamp ?view= before the SPA boots.
        (function () {
            try {
                var path = String(location.pathname || "");
                var mount = path.match(/^\/(explorer|workcenter|markdown)(?:\/|$)/i);
                if (!mount) return;
                var prefix = mount[1].toLowerCase();
                document.documentElement.dataset.cwspRouterBase = "/" + prefix;
                document.documentElement.dataset.cwspDefaultView =
                    prefix === "markdown" ? "viewer" : prefix;
                if (prefix !== "markdown") return;
                var url = new URL(location.href);
                if (url.searchParams.get("view")) return;
                url.searchParams.set("view", "viewer");
                history.replaceState(history.state, "", url.pathname + url.search + url.hash);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <script type="module" src="./entry.ts"></script>
</body>
</html>
