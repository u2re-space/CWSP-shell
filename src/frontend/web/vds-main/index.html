<!doctype html>
<html lang="en" data-cwsp-surface="vds-main">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>CWSP-shell</title>
    <link rel="icon" type="image/svg+xml" href="./pwa/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa/icons/icon.png" />
    <!-- WHY: iOS home-screen icon (does not use manifest icons). -->
    <link rel="apple-touch-icon" href="./pwa/icons/apple-touch-icon.png" />
    <!-- WHY: relative so u2re.space root SPA resolves under Vite base "./". -->
    <link rel="manifest" href="./pwa/manifest.json" />
    <!-- WHY: warm surface for WCO; #007acc painted a blue control strip over light titlebars. -->
    <meta name="theme-color" content="#cbb8a4" data-theme-color />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="CWSP-shell — U2RE environment workspace" />
    <script>
        // WHY: stale unhashed com/app.js binds `__vitePreload` to the wrong export.
        (function () {
            var KEY = "cw-shell-preload-bust";
            function stale(msg) {
                return /export named ['"]In['"]|__vitePreload|catch is not a function/i.test(String(msg || ""));
            }
            function bust() {
                if (sessionStorage.getItem(KEY)) return;
                sessionStorage.setItem(KEY, "1");
                var done = function () { location.reload(); };
                var sw = navigator.serviceWorker;
                var unreg = sw && sw.getRegistrations
                    ? sw.getRegistrations().then(function (regs) {
                        return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    })
                    : Promise.resolve();
                var clear = self.caches
                    ? caches.keys().then(function (keys) {
                        return Promise.all(keys.filter(function (k) {
                            return /workbox|precache|assets-cache/i.test(k);
                        }).map(function (k) { return caches.delete(k); }));
                    })
                    : Promise.resolve();
                Promise.all([unreg, clear]).then(done).catch(done);
            }
            addEventListener("error", function (e) { if (stale(e && e.message)) bust(); });
            addEventListener("unhandledrejection", function (e) {
                var r = e && e.reason;
                if (stale(r && r.message ? r.message : r)) bust();
            });
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; inline-size: 100%; block-size: 100%; overflow: hidden; }
        #app {
            display: grid; place-items: center; inline-size: 100%; block-size: 100%;
            min-block-size: 100dvb; font-family: system-ui, sans-serif; background: #121418; color: #e8e8e8;
        }
    </style>
</head>
<body>
    <div id="app">Loading CWSP-shell…</div>
    <script>
        // WHY: /markdown is a host alias for viewer; stamp ?view= before the SPA boots.
        (function () {
            try {
                var path = String(location.pathname || "");
                var mount = path.match(/^\/(explorer|workcenter|markdown)(?:\/|$)/i);
                if (!mount) return;
                var prefix = mount[1].toLowerCase();
                document.documentElement.dataset.cwspRouterBase = "/" + prefix;
                document.documentElement.dataset.cwspDefaultView =
                    prefix === "markdown" ? "viewer" : prefix;
                if (prefix !== "markdown") return;
                var url = new URL(location.href);
                if (url.searchParams.get("view")) return;
                url.searchParams.set("view", "viewer");
                history.replaceState(history.state, "", url.pathname + url.search + url.hash);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <script type="module" src="./entry.ts"></script>
</body>
</html>
